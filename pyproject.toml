[project]
name = "detector-golpe-vagas"
version = "0.1.0"
description = "Rule-based scam detector for Brazilian job ads: library, CLI, FastAPI and Streamlit."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ibson Diniz", email = "45883903+ibsondiniz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
detector-golpe = "detector_golpe.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "detector_golpe"
module-root = ""

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 160

[tool.pytest.ini_options]
testpaths = ["tests"]
